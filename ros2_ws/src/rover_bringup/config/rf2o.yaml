# rf2o_laser_odometry (MAPIRlab ros2 브랜치 b38c68e, Jetson ~/rf2o_ws 소스 빌드) — 2026-10-06 R3
# publish_tf false: odom→base_link 은 EKF 만 낸다. rf2o 출력 /odom_rf2o 는 rf2o_gate.py 가 걸러 EKF odom1 로.
# init_pose_from_topic "": 비우면 초기 자세 구독 없이 원점에서 시작(명령줄 -p 로는 빈 문자열을 못 넘겨 파일로 둔다 — 10-02 §13.1).
rf2o_laser_odometry:
  ros__parameters:
    laser_scan_topic: /scan
    odom_topic: /odom_rf2o
    publish_tf: false
    base_frame_id: base_link
    odom_frame_id: odom
    init_pose_from_topic: ""
    freq: 10.0

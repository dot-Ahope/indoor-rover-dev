# 조이스틱 teleop 설정 (DragonRise USB 패드, joy_linux)
# 매핑 (사용자 실측 2026-08-31): axis1=좌스틱 전후(양수=전진), axis2=우스틱 좌우(양수=좌회전)
# ⚠ 이 패드는 버튼이 js0로 안 들어옴 → 데드맨 버튼 불가. 안전모델 = "스틱 중립(데드존) = 정지" + 펌웨어 watchdog.
joy_node:
  ros__parameters:
    dev: /dev/input/js0
    # ⚠ 이 패드는 좌스틱 중립이 axis1≈-0.18로 치우침(실측 2026-08-31). 데드존을 0.25로 키워 중립=0 보장(크리프 방지).
    # TODO(production): jscal 캘리브레이션 또는 중립 정상인 조이스틱 사용 권장.
    deadzone: 0.25
    autorepeat_rate: 20.0
    coalesce_interval_ms: 20

teleop_twist_joy_node:
  ros__parameters:
    # 전진: linear.x = scale × axis[1] (양수 axis1 → +x 전진). 최대 기울기 = 최대속도(사용자 요청 2026-08-31).
    axis_linear:
      x: 1
    scale_linear:
      x: 0.10                 # 로버 최대 = 펌웨어 MAX_LINEAR_SPEED_MPS 0.100 (그 이상은 펌웨어가 saturate)
    # 조향: angular.z = scale × axis[2] (양수 axis2 → +z 좌회전). 최대 기울기 = 최대회전.
    axis_angular:
      yaw: 2
    scale_angular:
      yaw: 0.8                # §3 상한. ⚠ 고속 회전은 슬립↑·맵품질↓ — 맵핑 시엔 살살
    # (참고) turbo 미사용. 필요 시 별도 버튼으로 turbo 스케일 부여 가능하나 이 패드는 버튼 미작동.
    # 데드맨 버튼 없음 (이 패드 버튼 미작동) → 항상 스틱값을 cmd_vel로. 중립=0=정지.
    require_enable_button: false
    enable_turbo_button: -1

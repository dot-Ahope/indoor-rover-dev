# 장소 등록부 (F2.5 S0, 2026-10-28 — 설계 Docs/07_language/F25_PLACE_LLM_DESIGN.md §3.1)
# 좌표의 유일한 출처. LLM · 의도 해석기는 이 파일을 바꾸지 못하고 name/aliases 중 하나를 고를 뿐이다.
# 이름 = 기록에서 써 온 이름(사용자 10-28: "우선 우리가 부르던 이름으로"). 출처: 10-01 §8.3x 코스 정의 · 10-14 §27.3 이름 되돌림.
# 자리 = no5 순회 목표(10-26~10-28 반복 8/8) — 검증된 자리만 첫 판에 넣음.
# min_clear(선택): 목표 여유 검사 기준(m) — 없으면 place_server 기본 0.10. 낮출 때는 근거를 옆에 적는다.
# yaw_mode: p = 목표 보내기 직전 계획 경로 끝 0.3 m 방향(09-28 §16) · f = p 와 같되 위치(0.15 m) 안에 들면 방향 맞춤 없이 끝(10-07 §7, 좁은 남서 구석)
#           숫자 = 고정 방향(도)
map: office_v3          # 지도가 바뀌면 이 등록부는 무효 — place_server 가 실행 중 지도 이름과 다르면 이동 거부(TODO(improve): 지도 이름 확인 연결)
home: 출발점            # '돌아와' = 이 장소(09-30 §9 사용자: "돌아와 하면 출발 위치로 복귀")
places:
  - name: 출발점
    aliases: [출발 테이프, 처음 자리, 시작점, 홈]
    x: 0.0
    y: 0.0
    yaw_mode: p
    registered: 2026-10-28 · 출발 테이프 = 지도 원점(F1-2, 09-30)
  - name: B
    aliases: [비]
    x: 2.25
    y: -1.6
    yaw_mode: p
    registered: 2026-10-28 · no5 목표 1
  - name: C
    aliases: [씨, 위 복도]
    x: -1.6
    y: -2.0
    yaw_mode: p
    registered: 2026-10-28 · no5 목표 2(위 복도 (−1.6, −2.1) 와 10 cm 차라 한 자리로 묶음)
  - name: 통로 북쪽
    aliases: [서쪽 통로, 서쪽 통로 북쪽, 통로 입구]
    x: -1.65
    y: -3.7
    yaw_mode: p
    registered: 2026-10-28 · no5 목표 3 · 5
  - name: 남서
    aliases: [남서 구석, 통로 남쪽, 서쪽 통로 남쪽, 남쪽 주머니]
    x: -1.6
    y: -5.5
    yaw_mode: f
    min_clear: 0.0        # 10-28 §7: 등록 좌표에 차체를 놓으면 벽 칸에 닿음(여유 0.000 m) — 좁은 구석. no5 에서 위치만(f) 목표로 반복 도착(f2tf1 · f2tt1 · f2tt2 도착 (−1.47~−1.50, −5.31~−5.37), xy 0.18~0.23 m)해 온 자리라 기준을 0 으로. TODO(improve): 도착 실측 평균으로 좌표를 옮길지 결정
    registered: 2026-10-28 · no5 목표 4(좁은 곳 — 위치만)
  - name: W3
    aliases: [더블유3, 동쪽 끝]
    x: 5.5
    y: -2.2
    yaw_mode: p
    registered: 2026-10-28 · no5 목표 7(동쪽 끝, 바닥 전선 자리)

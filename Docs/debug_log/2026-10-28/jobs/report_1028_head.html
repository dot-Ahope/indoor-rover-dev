<title>10-28 장소 이름 이동</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 배치: 실험 노트 — 좁은 본문 열(65자) + 넓게 펼치는 그림 · 표, 판정은 왼쪽 띠 색으로(10-20 판과 같은 틀) */
:root{
  --bg:#f3f4f6; --paper:#ffffff; --ink:#1b1f24; --muted:#5b6470; --line:#d9dde3;
  --ir:#b3263e;      /* 프로젝터 켬 · 실패 쪽 */
  --cool:#1f7a72;    /* 프로젝터 끔 · 통과 쪽 */
  --warn:#a86a00;
  --tint-ir:#f8e8eb; --tint-cool:#e4f2f0; --tint-warn:#fbf1df;
  --f-body:"IBM Plex Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111418; --paper:#181c21; --ink:#e6e9ed; --muted:#9aa4b0; --line:#2c333b;
  --ir:#ef6b80; --cool:#5cc4b8; --warn:#e0a640;
  --tint-ir:#2b1b1f; --tint-cool:#15292a; --tint-warn:#2a2316; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111418; --paper:#181c21; --ink:#e6e9ed; --muted:#9aa4b0; --line:#2c333b;
  --ir:#ef6b80; --cool:#5cc4b8; --warn:#e0a640;
  --tint-ir:#2b1b1f; --tint-cool:#15292a; --tint-warn:#2a2316; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 64px}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:34px}
header{display:flex;flex-direction:column;gap:6px;border-bottom:2px solid var(--ink);padding-bottom:14px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
h1{font-size:30px;line-height:1.25;margin:0;font-weight:700;text-wrap:balance}
h2{font-size:20px;margin:0 0 4px;font-weight:700;text-wrap:balance}
h2 .sec{font-family:var(--f-mono);font-size:13px;color:var(--muted);font-weight:400;margin-left:8px}
p{margin:0;max-width:68ch}
section{display:flex;flex-direction:column;gap:12px}
.lead{color:var(--muted);max-width:72ch}
.verdicts{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.v{background:var(--paper);border:1px solid var(--line);border-left:5px solid var(--muted);padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.v.ok{border-left-color:var(--cool)} .v.no{border-left-color:var(--ir)} .v.wait{border-left-color:var(--warn)}
.v b{font-size:15px} .v span{color:var(--muted);font-size:13.5px}
.pill{display:inline-block;font-family:var(--f-mono);font-size:11.5px;padding:1px 8px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--tint-cool);color:var(--cool)} .pill.no{background:var(--tint-ir);color:var(--ir)} .pill.wait{background:var(--tint-warn);color:var(--warn)}
.tbl{overflow-x:auto;background:var(--paper);border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-weight:500;color:var(--muted);font-size:12.5px;white-space:nowrap}
td.n{font-family:var(--f-mono);white-space:nowrap}
tr:last-child td{border-bottom:none}
tr.hl td{background:var(--tint-cool)} tr.bad td{background:var(--tint-ir)}
figure{margin:0;background:var(--paper);border:1px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:8px}
figure img{width:100%;height:auto;display:block}
figcaption{font-size:13px;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:720px){.two{grid-template-columns:1fr}}
ul{margin:0;padding-left:20px;max-width:72ch} li{margin:2px 0}
.mono{font-family:var(--f-mono);font-size:13px}
.flow{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.flow .k{font-family:var(--f-mono);color:var(--muted);font-size:12.5px;padding-top:2px;white-space:nowrap}
.note{font-size:13px;color:var(--muted)}
.pm{background:var(--paper);border:1px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.pm h3{font-size:15.5px;margin:0;font-weight:700}
.pm .flow{grid-template-columns:auto 1fr;gap:6px 14px}
.pm .flow span:not(.k){max-width:none}
</style>

# nvblox N0 정지 측정용 파라미터 (2026-09-21). 기준: isaac_ros_nvblox release-3.2 nvblox_base.yaml + nvblox_realsense.yaml 을 우리 로버에 맞게.
#  - 입력: 호스트 realsense-ros 4.58.3 의 /camera/camera/depth/image_rect_raw + depth/camera_info (640x480x15, dec 4 는 점군에만 적용 — 깊이 이미지는 원해상도)
#  - 색·라이다 통합 없음(깊이만). 지도 프레임 odom(계획서 §3: slam_toolbox map->odom 점프가 TSDF 를 번지게 하므로 로컬 지도), base_link 반경 3 m 밖 소거
#  - ESDF 2D 슬라이스 높이: odom z 는 base_link 원점(바닥 +0.026) 기준 → 바닥(z −0.026) 제외하려고 최소 0.03, 최대 0.30(상자 0.114·다리; STVL 의 관심 높이와 맞춤)
#  - 통합 거리 2.0 m(obstacle_range 1.2 보다 여유), 통계 출력 켬(N0 (iii) 통합 주기·지연 측정)
/**:
  ros__parameters:
    global_frame: "odom"
    voxel_size: 0.03
    num_cameras: 1
    use_tf_transforms: true
    mapping_type: "static_tsdf"
    tick_period_ms: 10
    integrate_depth_rate_hz: 40.0
    integrate_color_rate_hz: 0.0
    integrate_lidar_rate_hz: 0.0
    update_mesh_rate_hz: 0.0
    update_esdf_rate_hz: 10.0
    publish_layer_rate_hz: 0.0
    publish_debug_vis_rate_hz: 0.0
    decay_tsdf_rate_hz: 5.0
    clear_map_outside_radius_rate_hz: 1.0
    print_rates_to_console: true
    print_timings_to_console: true
    print_delays_to_console: true
    print_queue_drops_to_console: true
    print_statistics_on_console_period_ms: 10000
    esdf_mode: "2d"
    publish_esdf_distance_slice: true
    use_color: false
    use_depth: true
    use_lidar: false
    maximum_input_queue_length: 10
    map_clearing_radius_m: 3.0
    map_clearing_frame_id: "base_link"
    input_qos: "SENSOR_DATA"
    esdf_slice_bounds_visualization_attachment_frame_id: "base_link"
    workspace_height_bounds_visualization_attachment_frame_id: "base_link"
    static_mapper:
      do_depth_preprocessing: false
      projective_integrator_max_integration_distance_m: 2.0
      projective_integrator_truncation_distance_vox: 4.0
      projective_integrator_weighting_mode: "inverse_square_tsdf_distance_penalty"
      projective_integrator_max_weight: 5.0
      esdf_integrator_min_weight: 0.1
      esdf_integrator_max_site_distance_vox: 2.0
      esdf_integrator_max_distance_m: 2.0
      esdf_slice_height: 0.10
      esdf_slice_min_height: 0.03
      esdf_slice_max_height: 0.30
      tsdf_decay_factor: 0.95
      tsdf_decayed_weight_threshold: 0.001
      tsdf_decayed_free_distance_vox: 4.0
